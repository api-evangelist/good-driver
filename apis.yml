aid: good-driver
name: Good Driver
description: 'Good Driver Club (formerly Good Driver Mutuality) is an insurtech company
  backed by Ribbit Capital and Hedosophia. It runs a membership-based, cost-sharing
  alternative to traditional collision and comprehensive auto coverage: members pay
  weekly pledges into a shared community pool that covers vehicle damage from accidents,
  weather, theft, and other qualifying events across 5,000+ partner repair shops nationwide,
  and accident-free members keep their unused pledge balances as savings. It is explicitly
  not insurance. The product is delivered through a consumer mobile app (Good Driver
  Club on Google Play); the company publishes no public developer API, OpenAPI, or
  documentation surface at this time.'
